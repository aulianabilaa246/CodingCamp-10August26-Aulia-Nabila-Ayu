<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Life Dashboard</title>
    <!-- Anti-flash: apply saved theme before CSS loads to prevent FOUC -->
    <script>
      (function() {
        var t = localStorage.getItem('tld_theme') || 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <button id="theme-toggle" aria-label="Switch to dark mode">🌙</button>
    <div class="dashboard">
      <section id="widget-greeting" aria-label="Greeting">
        <h2>
          <span id="greeting-phrase">Good Morning</span>
          <span id="greeting-name-display"></span>
        </h2>
        <p id="greeting-time" aria-label="Current time"></p>
        <p id="greeting-date" aria-label="Current date"></p>
        <div class="name-edit-area" id="greeting-name-area">
          <button id="greeting-name-edit" type="button">✏️ Edit Name</button>
          <div id="greeting-name-form" hidden>
            <label for="greeting-name-input">Your name</label>
            <input type="text" id="greeting-name-input" placeholder="Enter your name" autocomplete="off">
            <button id="greeting-name-save" type="button">Save</button>
            <span aria-live="polite" id="greeting-name-error" class="error-msg"></span>
          </div>
        </div>
      </section>
      <section id="widget-timer" aria-label="Focus Timer">
        <h2>Focus Timer</h2>
        <div id="timer-display" aria-live="polite" aria-label="Timer display">25:00</div>
        <div class="timer-controls">
          <button id="timer-start" type="button">&#9654; Start</button>
          <button id="timer-stop" type="button" disabled aria-disabled="true">&#9646;&#9646; Stop</button>
          <button id="timer-reset" type="button">&#8634; Reset</button>
        </div>
        <div class="timer-duration-area">
          <label for="timer-duration-input">Duration (min):</label>
          <input type="number" id="timer-duration-input" min="25" max="60" value="25" aria-label="Timer duration in minutes">
          <button id="timer-duration-save" type="button">Set</button>
          <span aria-live="polite" id="timer-duration-error" class="error-msg"></span>
        </div>
      </section>
      <section id="widget-tasks" aria-label="To-Do List">
        <h2>To-Do List</h2>
        <div class="task-add-area">
          <label for="task-input">New task</label>
          <div class="task-add-row">
            <input type="text" id="task-input" placeholder="Add a new task…" autocomplete="off" aria-describedby="task-input-error">
            <button id="task-add-btn" type="button">+ Add</button>
          </div>
          <span aria-live="polite" id="task-input-error" class="error-msg"></span>
        </div>
        <div class="task-sort-area">
          <label for="task-sort-select">Sort by</label>
          <select id="task-sort-select" aria-label="Sort tasks">
            <option value="date-asc">Date Added ↑</option>
            <option value="date-desc">Date Added ↓</option>
            <option value="alpha-az">A → Z</option>
            <option value="alpha-za">Z → A</option>
            <option value="incomplete-first">Incomplete First</option>
            <option value="complete-first">Complete First</option>
          </select>
        </div>
        <ul id="task-list" role="list" aria-label="Task list" aria-live="polite"></ul>
      </section>
      <section id="widget-links" aria-label="Quick Links">
        <!-- Links module content injected by js/app.js -->
      </section>
    </div>
    <script src="js/app.js" defer></script>
  </body>
</html>
